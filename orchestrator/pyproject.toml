[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "orchestrator"
version = "0.1.0"
description = "Deploy Dash backend dispatch framework and workflow plugins"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.13"
dependencies = [
    "pyinfra>=3.10.0,<4.0",
]

[project.scripts]
orchestrator = "orchestrator.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.hatch.build.targets.wheel.force-include]
"src/orchestrator/http_parts/index.html" = "orchestrator/http_parts/index.html"

[tool.coverage.run]
# Coverage measures first-party source only. Test modules are executed by
# definition, so including them inflates the denominator and makes the headline
# number look better than the code actually is.
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501 (line-too-long) is redundant with `ruff format`, and actively wrong
# for the ~145 lines it still flags here: those are single-token shell
# script strings and URLs (see engine_infra_ops.py's server-facts probe
# script) that the formatter deliberately leaves alone because there is no
# safe way to wrap them. Manually splitting a shell command string risks
# injecting whitespace/newline bugs into a command that runs on a
# customer's server for zero readability gain. This is ruff's own
# documented recommendation when the formatter is enabled.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Each `*_parts/__init__.py` re-exports its submodules' names as the
# package's public surface (e.g. `from orchestrator.app_parts import
# AppConfigValidationError` elsewhere) -- unused only from the __init__
# file's own point of view.
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["orchestrator"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# T-2.1.6 baseline (2026-09-01): 59 modules, suppressing 2,386 strict-mypy
# errors when measured with this override stripped. The list is ordered by
# ascending suppressed-error count (ties alphabetically), so the next paydown
# starts with the cheapest module rather than the loudest. New source is
# strict-checked by default; the architecture ratchet permits this list only
# to shrink and rejects an entry that no longer needs the exemption.
module = [
    # 2 strict errors
    "orchestrator.app_parts.app_plan",
    "orchestrator.app_parts.part0_prepare_key",
    "orchestrator.dns_parts.dns_plan",
