name: Desktop Snap Build

on:
  workflow_call:
    inputs:
      build_name:
        description: Desktop build version name (X.Y.Z from the release tag)
        required: false
        type: string
      build_number:
        description: Monotonic build number (GitHub run number of the release)
        required: false
        type: string
    secrets:
      DEPLOYDASH_GITHUB_CLIENT_ID:
        required: false
      DEPLOYDASH_GITHUB_CLIENT_SECRET:
        required: false
      DEPLOYDASH_SHOW_MANUAL_GITHUB_CALLBACK:
        required: false
      DEPLOYDASH_GITHUB_ENABLE_DEPLOY_KEY_WRITE:
        required: false
      DEPLOYDASH_AMPLITUDE_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      build_name:
        description: Optional override for the desktop build version name
        required: false
        type: string
      build_number:
        description: Optional override for the desktop build version number
        required: false
        type: string

permissions:
  contents: write

env:
  ORCHESTRATOR_PACKAGE_SOURCE: local-wheel
  ORCHESTRATOR_ALLOW_LOCAL_FALLBACK: "0"

jobs:
  snap:
    name: Build strict core24 Snap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Mask consumed secrets in logs
        shell: bash
        run: |
          echo "::add-mask::${{ secrets.DEPLOYDASH_GITHUB_CLIENT_ID }}"
          echo "::add-mask::${{ secrets.DEPLOYDASH_GITHUB_CLIENT_SECRET }}"
          echo "::add-mask::${{ secrets.DEPLOYDASH_SHOW_MANUAL_GITHUB_CALLBACK }}"
          echo "::add-mask::${{ secrets.DEPLOYDASH_GITHUB_ENABLE_DEPLOY_KEY_WRITE }}"
          echo "::add-mask::${{ secrets.DEPLOYDASH_AMPLITUDE_API_KEY }}"

      - name: Install Snapcraft build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          sudo snap install snapcraft --classic

      - name: Create optional CI Dart defines
        uses: ./.github/actions/ci-dart-defines
        with:
          github-client-id: ${{ secrets.DEPLOYDASH_GITHUB_CLIENT_ID }}
          github-client-secret: ${{ secrets.DEPLOYDASH_GITHUB_CLIENT_SECRET }}
          show-manual-github-callback: ${{ secrets.DEPLOYDASH_SHOW_MANUAL_GITHUB_CALLBACK }}
          github-enable-deploy-key-write: ${{ secrets.DEPLOYDASH_GITHUB_ENABLE_DEPLOY_KEY_WRITE }}
          amplitude-api-key: ${{ secrets.DEPLOYDASH_AMPLITUDE_API_KEY }}

      - name: Build and lint Snap
        shell: bash
        env:
          INPUT_BUILD_NAME: ${{ inputs.build_name }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          build_name="${INPUT_BUILD_NAME:-}"
          build_number="${INPUT_BUILD_NUMBER:-}"
          if [[ -z "${build_number}" ]]; then
            build_number="${GITHUB_RUN_NUMBER}"
          fi
          export DEPLOYDASH_BUILD_NAME="${build_name}"
          export DEPLOYDASH_BUILD_NUMBER="${build_number}"
          export DEPLOYDASH_DART_DEFINES_FILE="${DEPLOYDASH_DART_DEFINES_FILE:-}"
          export DEPLOYDASH_SNAPCRAFT_BUILD_MODE=destructive
          cd "${GITHUB_WORKSPACE}/ui"
          bash scripts/build_snap.sh

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v6
        with:
          name: deploydash-ubuntu-snap
          path: ui/build/snap/*.snap
          if-no-files-found: error
          retention-days: 14

      - name: Attach Snap to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Parallel build jobs share one draft release; a lost create race
          # must fall through to the upload, while a real failure (auth,
          # permissions) still fails when the re-check finds nothing.
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --draft --title "Deploy Dash ${tag}" --generate-notes \
              || gh release view "${tag}" >/dev/null
          fi
          # shellcheck disable=SC2086
          gh release upload "${tag}" ui/build/snap/*.snap --clobber
