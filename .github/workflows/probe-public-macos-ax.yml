# Diagnostic probe for the hosted-Mac split, Phase 0 (M0.2 + M0.3).
# Dispatch-only; kept as a permanent diagnostic like the Windows probe.
# Proves, on hosted macos-15:
#   M0.2 osascript/System Events can read AX trees (baked TCC grants),
#        directly AND over self-SSH; Swift AX negative control included.
#   M0.3 self-SSH works (Remote Login + loopback key from the job).
name: Probe hosted macOS AX and self-SSH

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Console session and sudo proof
        shell: bash
        run: |
          whoami
          echo "console_owner=$(stat -f '%Su' /dev/console)"
          if ! sudo -n true 2>/dev/null; then
            echo "passwordless sudo is unavailable; self-SSH setup cannot proceed." >&2
            exit 1
          fi
          echo "passwordless sudo OK"

      - name: Enable self-SSH (M0.3)
        shell: bash
        run: |
          sudo systemsetup -setremotelogin on
          mkdir -p "${HOME}/.ssh" && chmod 700 "${HOME}/.ssh"
          ssh-keygen -t ed25519 -N '' -f "${HOME}/.ssh/probe-loopback" -q
          cat "${HOME}/.ssh/probe-loopback.pub" >> "${HOME}/.ssh/authorized_keys"
          chmod 600 "${HOME}/.ssh/authorized_keys"
          for i in $(seq 1 6); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
                -i "${HOME}/.ssh/probe-loopback" localhost 'echo SSH-OK' 2>/dev/null; then
              echo "self-SSH up after ${i} tries"
              exit 0
            fi
            sleep 10
          done
          echo "self-SSH never came up." >&2
          exit 1

      - name: osascript AX probe, direct (M0.2)
        shell: bash
        run: |
          # Deterministic target: a fresh Finder window always has AX children.
          osascript -e 'tell application "Finder" to make new Finder window'
          sleep 2
          procs="$(osascript -e 'tell application "System Events" to get name of every process')"
          echo "${procs}" | grep -q Finder || { echo "Finder missing from process list." >&2; exit 1; }
          echo "System Events sees $(echo "${procs}" | tr ',' '\n' | wc -l) processes"
          echo "UI elements enabled: $(osascript -e 'tell application "System Events" to get UI elements enabled')"
          osascript -e 'tell application "System Events" to tell process "Finder"
            return {count of windows, name of window 1, role of window 1, position of window 1}
          end tell'
          echo "WindowServer/loginwindow:"
          pgrep -fl "WindowServer|loginwindow" | head -4 || true
          echo "CGSession: $(/System/Library/CoreServices/RemoteManagement/AppleVNCServer.bundle/Contents/Support/cgssession 2>/dev/null || echo n/a)"
          screencapture -x "${RUNNER_TEMP}/ax-probe.png" && ls -la "${RUNNER_TEMP}/ax-probe.png"
          # Query ladder: entire-contents is widely reported flaky
          # (returns empty instead of erroring), so prove each rung.
          osascript -e 'tell application "System Events" to tell process "Finder"
            return {count of windows, name of window 1}
          end tell'
          direct_kids="$(osascript -e 'tell application "System Events" to tell process "Finder"
            return (count of UI elements of window 1) as string
          end tell')"
          echo "Finder window 1 direct UI elements: ${direct_kids}"
          result="$(osascript -e 'tell application "System Events" to tell process "Finder"
            set elCount to count of entire contents of window 1
            return elCount as string
          end tell')"
          echo "Finder window 1 entire-contents (known-flaky): ${result}"
          # The port's primitive: recursive UI-elements walk.
          # (echo-built: a heredoc terminator cannot live inside YAML.)
          {
            echo 'on countWalk(el)'
            echo '  set n to 0'
            echo '  tell application "System Events"'
            echo '    repeat with kid in (UI elements of el)'
            echo '      set n to n + 1 + my countWalk(kid)'
            echo '    end repeat'
            echo '  end tell'
            echo '  return n'
            echo 'end countWalk'
            echo 'tell application "System Events" to tell process "Finder"'
            echo '  return my countWalk(window 1)'
            echo 'end tell'
          } > "${RUNNER_TEMP}/walk.scpt"
          walked="$(osascript "${RUNNER_TEMP}/walk.scpt")"
          echo "Finder window 1 recursive-walk count: ${walked}"
          # Input path proof (Escape on Finder is a no-op).
          osascript -e 'tell application "System Events" to tell process "Finder"
            set frontmost to true
            keystroke (ASCII character 27)
          end tell'
          echo "frontmost + keystroke OK"
          if [[ ! "${walked}" =~ ^[0-9]+$ ]] || [[ "${walked}" -lt 5 ]]; then
            echo "AX tree unreadable directly (walked '${walked}')." >&2
            exit 1
          fi

      - name: osascript AX probe over self-SSH (M0.2)
        shell: bash
        run: |
          # The money step: the gate drives the Mac over SSH, so AX must
          # work from an SSH session, not just the job shell. Uses the
          # recursive-walk primitive (entire-contents is flaky).
          scp -o BatchMode=yes -i "${HOME}/.ssh/probe-loopback" \
            "${RUNNER_TEMP}/walk.scpt" localhost:/tmp/probe-walk.scpt
          walked="$(ssh -o BatchMode=yes -i "${HOME}/.ssh/probe-loopback" localhost \
            "osascript /tmp/probe-walk.scpt")"
          echo "Finder window 1 recursive-walk count (over SSH): ${walked}"
          if [[ ! "${walked}" =~ ^[0-9]+$ ]] || [[ "${walked}" -lt 5 ]]; then
            echo "AX tree unreadable over SSH (walked '${walked}')." >&2
            exit 1
          fi

      - name: Upload session screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-ax-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/ax-probe.png
          if-no-files-found: warn
          retention-days: 7

      - name: Swift AX negative control (M0.2)
        shell: bash
        run: |
          # If ad-hoc Swift AX reads AND writes worked on hosted runners,
          # the driver port would be unnecessary. Expect reads to work
          # (AX reads need no grant) but AXPress to fail (writes need
          # caller trust no ad-hoc binary has); record either way.
          # (echo-built: a flush heredoc terminator breaks YAML, an
          # indented one silently swallows the rest of the step.)
          {
            echo 'import Cocoa'
            echo 'let finder = NSWorkspace.shared.runningApplications.first {'
            echo '  $0.bundleIdentifier == "com.apple.Finder"'
            echo '}!'
            echo 'let el = AXUIElementCreateApplication(finder.processIdentifier)'
            echo 'var v: AnyObject?'
            echo 'let r = AXUIElementCopyAttributeValue(el, "AXWindows" as CFString, &v)'
            echo 'let wins = (r == .success ? v as? [AXUIElement] : nil) ?? []'
            echo 'print("READ axwindows=\(wins.count) result=\(r.rawValue)")'
            echo 'var w: AnyObject?'
            echo 'if wins.count > 0, AXUIElementCopyAttributeValue(wins[0], "AXCloseButton" as CFString, &w) == .success, let b = w {'
            echo '  let p = AXUIElementPerformAction(b as! AXUIElement, "AXPress" as CFString)'
            echo '  print("WRITE axpress result=\(p.rawValue)")'
            echo '} else {'
            echo '  print("WRITE no close button resolved")'
            echo '}'
          } > "${RUNNER_TEMP}/axcheck.swift"
          swiftc -o "${RUNNER_TEMP}/axcheck" "${RUNNER_TEMP}/axcheck.swift"
          "${RUNNER_TEMP}/axcheck" || true
          echo "(control only: WRITE failure is the expected hosted outcome)"
