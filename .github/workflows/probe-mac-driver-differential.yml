# Driver proof on hosted macos-15 (P1.2a). Dispatch-only permanent
# diagnostic. Everything runs over self-SSH (the gate's context).
# Pass contract:
#   - Swift tools are viability-probed, not trusted: raw AX reads DO
#     work over self-SSH on hosted runners (only the job-shell context
#     is blind). If Swift resolves, byte-parity with the shim dump is
#     required; Swift press/click landing is measured too. If raw AX
#     proves FULLY viable (reads+press+click all land), the port is
#     unnecessary and this FAILS LOUD for a human pivot decision.
#   - shim axdump MUST return populated AX-style trees (3 identical
#     rounds), shim axpress MUST land (PRESS OK + window closes),
#     shim axclick MUST land (frontmost flips), keystroke MUST exit 0.
#   - Flutter leg: the M0.1 spike DMG installs, the real onboarding
#     tree is readable (`Get started`, zero intro fields).
# Timings for every shim dump land in the step summary.
name: Mac driver differential (hosted)

on:
  workflow_dispatch:
    inputs:
      qa-ref:
        description: deploydash_qa ref carrying the osascript shims
        required: false
        default: ci/mac-osascript-driver
      spike-run-id:
        description: M0.1 run id whose deploydash-macos-arm64 artifact feeds the Flutter leg
        required: false
        default: "41157814456"

permissions:
  contents: read

jobs:
  differential:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Mask consumed secrets
        shell: bash
        run: |
          echo "::add-mask::${{ secrets.QA_SUITE_DEPLOY_KEY }}"

      - name: Check out Swift originals (QA main)
        uses: actions/checkout@v5
        with:
          repository: deploydash/deploydash_qa
          ref: main
          ssh-key: ${{ secrets.QA_SUITE_DEPLOY_KEY }}
          path: qa-swift

      - name: Check out osascript shims
        uses: actions/checkout@v5
        with:
          repository: deploydash/deploydash_qa
          ref: ${{ inputs.qa-ref }}
          ssh-key: ${{ secrets.QA_SUITE_DEPLOY_KEY }}
          path: qa-shims

      - name: Download spike DMG for the Flutter leg
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.spike-run-id }}" \
            -R deploydash/deploydash_app -n deploydash-macos-arm64 \
            -D "${RUNNER_TEMP}/spike-dmg"
          ls -la "${RUNNER_TEMP}/spike-dmg"

      - name: Build Swift tools
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/swift-bin"
          for tool in axdump axpress axclick; do
            swiftc -o "${RUNNER_TEMP}/swift-bin/${tool}" \
              "qa-swift/qa/e2e/harnesses/desktop_macos/tools/${tool}.swift"
          done
          ls "${RUNNER_TEMP}/swift-bin"

      - name: Install osascript shims (exercises build.sh)
        shell: bash
        run: |
          bash qa-shims/qa/e2e/harnesses/desktop_macos/build.sh
          ls qa-shims/qa/e2e/harnesses/desktop_macos/bin

      - name: Enable self-SSH
        shell: bash
        run: |
          sudo systemsetup -setremotelogin on
          mkdir -p "${HOME}/.ssh" && chmod 700 "${HOME}/.ssh"
          ssh-keygen -t ed25519 -N '' -f "${HOME}/.ssh/diff-loopback" -q
          cat "${HOME}/.ssh/diff-loopback.pub" >> "${HOME}/.ssh/authorized_keys"
          chmod 600 "${HOME}/.ssh/authorized_keys"
          for i in $(seq 1 6); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
                -i "${HOME}/.ssh/diff-loopback" localhost 'echo SSH-OK' 2>/dev/null; then
              echo "self-SSH up after ${i} tries"
              exit 0
            fi
            sleep 10
          done
          echo "self-SSH never came up." >&2
          exit 1

      - name: Label anatomy probe
        shell: bash
        run: |
          # Round 3 showed static-text labels diverging (shim [text] vs
          # real strings): print every candidate property for the first
          # 3 static texts found, plus the raw `properties` record shape.
          osascript -e 'tell application "Finder" to make new Finder window'
          sleep 2
          echo "--- name batch (window 1 direct children):"
          osascript -e 'tell application "System Events" to tell process "Finder" to return name of every UI element of window 1' 2>&1 | head -c 500
          echo ""
          echo "--- properties records (window 1 direct children):"
          osascript -e 'tell application "System Events" to tell process "Finder" to return properties of every UI element of window 1' 2>&1 | head -c 1500
          echo ""
          echo "--- deep static-text anatomy (first 3 found):"
          {
            echo 'on run arguments'
            echo '  tell application "System Events" to set rootRef to process "Finder"'
            echo '  set found to my findTexts(rootRef, 0, 0)'
            echo '  return "texts-examined=" & (found as string)'
            echo 'end run'
            echo 'on findTexts(containerRef, depth, found)'
            echo '  if depth > 14 then return found'
            echo '  if found >= 3 then return found'
            echo '  tell application "System Events"'
            echo '    set kids to every UI element of containerRef'
            echo '    set rolesList to role of every UI element of containerRef'
            echo '  end tell'
            echo '  repeat with i from 1 to count of kids'
            echo '    if (item i of rolesList) contains "static" then'
            echo '      my printProps(item i of kids)'
            echo '      set found to found + 1'
            echo '      if found >= 3 then return found'
            echo '    end if'
            echo '    set found to my findTexts(item i of kids, depth + 1, found)'
            echo '    if found >= 3 then return found'
            echo '  end repeat'
            echo '  return found'
            echo 'end findTexts'
            echo 'on show(label, el, which)'
            echo '  try'
            echo '    tell application "System Events"'
            echo '      if which is "title" then set v to title of el'
            echo '      if which is "description" then set v to description of el'
            echo '      if which is "accdesc" then set v to accessibility description of el'
            echo '      if which is "value" then set v to value of el'
            echo '      if which is "name" then set v to name of el'
            echo '      if which is "roledesc" then set v to role description of el'
            echo '    end tell'
            echo '    if v is missing value then set v to "<missing>"'
            echo '    log label & "=" & (v as string)'
            echo '  on error errMsg'
            echo '    log label & "=ERROR(" & errMsg & ")"'
            echo '  end try'
            echo 'end show'
            echo 'on printProps(el)'
            echo '  my show("TITLE", el, "title")'
            echo '  my show("DESC", el, "description")'
            echo '  my show("ACCDESC", el, "accdesc")'
            echo '  my show("VALUE", el, "value")'
            echo '  my show("NAME", el, "name")'
            echo '  my show("ROLEDESC", el, "roledesc")'
            echo 'end printProps'
          } > /tmp/anatomy.scpt
          osascript /tmp/anatomy.scpt 2>&1 | head -c 2000
          echo ""

      - name: Single-pull timing experiment
        shell: bash
        run: |
          # Round 3 dumps took ~60s at 4 pulls/container. Time one pull
          # (`properties` records) over the same tree to prove the cost
          # is event count, not tree size.
          {
            echo 'on run arguments'
            echo '  set t0 to current date'
            echo '  tell application "System Events" to set rootRef to process "Finder"'
            echo '  set n to my countProps(rootRef, 0)'
            echo '  set secs to ((current date) - t0)'
            echo '  return "elements=" & n & " secs=" & secs'
            echo 'end run'
            echo 'on countProps(containerRef, depth)'
            echo '  if depth > 14 then return 0'
            echo '  try'
            echo '    tell application "System Events"'
            echo '      set kids to every UI element of containerRef'
            echo '      set recs to properties of every UI element of containerRef'
            echo '    end tell'
            echo '  on error'
            echo '    return 0'
            echo '  end try'
            echo '  set n to count of kids'
            echo '  repeat with k in kids'
            echo '    set n to n + my countProps(k, depth + 1)'
            echo '  end repeat'
            echo '  return n'
            echo 'end countProps'
          } > /tmp/singlepull.scpt
          osascript /tmp/singlepull.scpt 2>&1 | head -c 300
          echo ""

      - name: Run native differential over self-SSH
        shell: bash
        run: |
          # Same machine/user over loopback, so absolute tool paths carry
          # over; only the bootstrap context differs. (echo-built: a
          # flush heredoc terminator breaks YAML, an indented one
          # silently swallows the rest of the step.)
          {
            echo 'set -u'
            echo 'OUT="/tmp/driver-diff"'
            echo 'mkdir -p "$OUT"'
            echo 'rm -f "$OUT"/*'
            echo 'FAIL=0'
            echo 'SWIFT_DUMP_OK=0'
            echo 'SWIFT_PRESS_LANDED=0'
            echo 'SWIFT_CLICK_LANDED=0'
            echo 'cmp_files() {'
            echo '  if cmp -s "$1" "$2"; then'
            echo '    echo "DIFF-OK: $3 identical"'
            echo '  else'
            echo '    echo "DIFF-FAIL: $3 differs"'
            echo '    FAIL=1'
            echo '  fi'
            echo '}'
            echo 'timed_dump() {'
            echo '  start=$(date +%s)'
            echo '  if [ -n "$2" ]; then'
            echo '    "$1" Finder "$2" > "$3" 2> "$3.err"; rc=$?'
            echo '  else'
            echo '    "$1" Finder > "$3" 2> "$3.err"; rc=$?'
            echo '  fi'
            echo '  end=$(date +%s)'
            echo '  echo "$4 $((end - start))s rc=$rc"'
            echo '}'
            echo 'wincount() {'
            echo '  osascript -e "tell application \"System Events\" to tell process \"Finder\" to return count of windows"'
            echo '}'
            echo 'frontmost() {'
            echo '  osascript -e "tell application \"System Events\" to return frontmost of process \"$1\""'
            echo '}'
            echo 'osascript -e "tell application \"Finder\" to close every window" 2>/dev/null || true'
            echo 'sleep 1'
            echo 'osascript -e "tell application \"Finder\" to make new Finder window"'
            echo 'sleep 2'
            echo 'echo "windows: $(wincount)"'
            echo '"$SWIFT_BIN/axdump" Finder > "$OUT/swift-full.txt" 2> "$OUT/swift-full.err"; swift_rc=$?'
            echo 'echo "swift dump rc=$swift_rc"'
            echo 'cat "$OUT/swift-full.err"'
            echo 'if [ "$swift_rc" = "1" ] && grep -q "no running app named Finder" "$OUT/swift-full.err"; then'
            echo '  echo "DIFF-NOTE: raw AX reads dead on hosted (port stands by default)"'
            echo '  SWIFT_ALIVE=0'
            echo 'else'
            echo '  echo "DIFF-NOTE: Swift resolved; parity required instead"'
            echo '  SWIFT_ALIVE=1'
            echo 'fi'
            echo 'if [ "$SWIFT_ALIVE" = "1" ] && grep -q "AXDUMP-DONE" "$OUT/swift-full.txt" && [ "$(wc -l < "$OUT/swift-full.txt")" -gt 1 ]; then'
            echo '  SWIFT_DUMP_OK=1'
            echo 'fi'
            echo 'r=1'
            echo 'while [ $r -le 3 ]; do'
            echo '  timed_dump "$SHIM_BIN/axdump" "" "$OUT/shim-full-$r.txt" "shim-full-$r"'
            echo '  r=$((r + 1))'
            echo 'done'
            echo 'cmp_files "$OUT/shim-full-1.txt" "$OUT/shim-full-2.txt" "shim-rounds"'
            echo 'cmp_files "$OUT/shim-full-2.txt" "$OUT/shim-full-3.txt" "shim-rounds"'
            echo 'if [ "$SWIFT_ALIVE" = "1" ]; then'
            echo '  cmp_files "$OUT/swift-full.txt" "$OUT/shim-full-1.txt" "swift-vs-shim-full"'
            echo 'fi'
            echo 'wc -l "$OUT/shim-full-1.txt"'
            echo 'if grep -qE "AXButton|AXTextField|AXStaticText" "$OUT/shim-full-1.txt"; then'
            echo '  echo "DIFF-OK: shim tree carries AX-style roles"'
            echo 'else'
            echo '  echo "DIFF-FAIL: shim tree lacks AX-style roles"; FAIL=1'
            echo 'fi'
            echo 'label=$(grep -o "\\[[^]]*\\]" "$OUT/shim-full-1.txt" | grep -v "\\[\\]" | head -n 1 | tr -d "[]")'
            echo 'if [ -z "$label" ]; then label="e"; fi'
            echo 'echo "substring probe: [$label]"'
            echo 'timed_dump "$SHIM_BIN/axdump" "$label" "$OUT/shim-sub-1.txt" "shim-sub-1"'
            echo 'timed_dump "$SHIM_BIN/axdump" "$label" "$OUT/shim-sub-2.txt" "shim-sub-2"'
            echo 'cmp_files "$OUT/shim-sub-1.txt" "$OUT/shim-sub-2.txt" "shim-substring-rounds"'
            echo 'if grep -q . "$OUT/shim-sub-1.txt"; then'
            echo '  echo "DIFF-OK: substring dump non-empty"'
            echo 'else'
            echo '  echo "DIFF-FAIL: substring dump empty"; FAIL=1'
            echo 'fi'
            echo '"$SWIFT_BIN/axpress" Finder "zzz-no-such-button-zzz" > "$OUT/swift-nf.txt" 2>&1; swift_rc=$?'
            echo 'echo "swift notfound rc=$swift_rc : $(cat "$OUT/swift-nf.txt") (recorded only)"'
            echo '"$SHIM_BIN/axpress" Finder "zzz-no-such-button-zzz" > "$OUT/shim-nf.txt" 2>&1; shim_rc=$?'
            echo 'if [ "$shim_rc" = "1" ] && grep -q "NOT-FOUND zzz-no-such-button-zzz" "$OUT/shim-nf.txt"; then'
            echo '  echo "DIFF-OK: shim NOT-FOUND contract"'
            echo 'else'
            echo '  echo "DIFF-FAIL: shim NOT-FOUND contract broken"; FAIL=1'
            echo 'fi'
            echo 'open -a TextEdit'
            echo 'sleep 2'
            echo 'osascript -e "tell application \"System Events\" to keystroke \"n\" using command down"'
            echo 'sleep 1'
            echo 'osascript -e "tell application \"System Events\" to keystroke \"x\""'
            echo 'sleep 1'
            echo 'osascript -e "tell application \"System Events\" to keystroke \"w\" using command down"'
            echo 'sleep 2'
            echo '"$SHIM_BIN/axdump" TextEdit "Cancel" > "$OUT/shim-sheet-before.txt" 2>&1'
            echo 'if grep -q "Cancel" "$OUT/shim-sheet-before.txt"; then'
            echo '  echo "DIFF-OK: save sheet is up (shim reads it)"'
            echo 'else'
            echo '  echo "DIFF-FAIL: save sheet never appeared"; FAIL=1'
            echo 'fi'
            echo '"$SHIM_BIN/axpress" TextEdit "Cancel" > "$OUT/shim-press.txt" 2>&1; shim_rc=$?'
            echo 'sleep 2'
            echo '"$SHIM_BIN/axdump" TextEdit "Cancel" > "$OUT/shim-sheet-after.txt" 2>&1'
            echo 'echo "shim press rc=$shim_rc : $(cat "$OUT/shim-press.txt")"'
            echo 'if [ "$shim_rc" = "0" ] && ! grep -q "Cancel" "$OUT/shim-sheet-after.txt"; then'
            echo '  echo "DIFF-OK: shim press landed (sheet dismissed)"'
            echo 'else'
            echo '  echo "DIFF-FAIL: shim press did not land"; FAIL=1'
            echo 'fi'
            echo 'osascript -e "tell application \"System Events\" to keystroke \"w\" using command down"'
            echo 'sleep 2'
            echo '"$SWIFT_BIN/axpress" TextEdit "Cancel" > "$OUT/swift-press.txt" 2>&1; swift_rc=$?'
            echo 'sleep 2'
            echo '"$SWIFT_BIN/axdump" TextEdit "Cancel" > "$OUT/swift-sheet-after.txt" 2>&1'
            echo 'echo "swift press rc=$swift_rc : $(cat "$OUT/swift-press.txt")"'
            echo 'if [ "$swift_rc" = "0" ] && ! grep -q "Cancel" "$OUT/swift-sheet-after.txt"; then'
            echo '  echo "DIFF-NOTE: raw AXPress LANDED on hosted (viability input)"'
            echo '  SWIFT_PRESS_LANDED=1'
            echo 'else'
            echo '  echo "DIFF-OK: raw AXPress denied as expected (port stands)"'
            echo 'fi'
            echo 'osascript -e "tell application \"System Events\" to keystroke \"w\" using command down" 2>/dev/null || true'
            echo 'sleep 1'
            echo '"$SHIM_BIN/axpress" TextEdit "Don" >/dev/null 2>&1 || true'
            echo 'sleep 1'
            echo 'osascript -e "tell application \"TextEdit\" to quit" 2>/dev/null || true'
            echo 'if [ "$(frontmost Finder)" != "true" ]; then'
            echo '  osascript -e "tell application \"Finder\" to activate"'
            echo '  sleep 2'
            echo 'fi'
            echo 'close_target() {'
            echo '  pos=$(osascript -e "tell application \"System Events\" to tell process \"Finder\" to return position of button 1 of window 1")'
            echo '  size=$(osascript -e "tell application \"System Events\" to tell process \"Finder\" to return size of button 1 of window 1")'
            echo '  px=$(echo "$pos" | cut -d, -f1); py=$(echo "$pos" | cut -d, -f2)'
            echo '  sw=$(echo "$size" | cut -d, -f1); sh=$(echo "$size" | cut -d, -f2)'
            echo '  cx=$((px + sw / 2)); cy=$((py + sh / 2))'
            echo '  echo "click target (close box): $cx,$cy"'
            echo '}'
            echo 'screencapture -x "$OUT/pre-click.png" || true'
            echo 'if [ "$(wincount)" = "0" ]; then'
            echo '  osascript -e "tell application \"Finder\" to make new Finder window"'
            echo '  sleep 2'
            echo 'fi'
            echo 'close_target'
            echo 'before_click=$(wincount)'
            echo '"$SWIFT_BIN/axclick" "$cx" "$cy" > "$OUT/swift-click.txt" 2>&1; swift_rc=$?'
            echo 'sleep 2'
            echo 'mid_click=$(wincount)'
            echo 'echo "swift click rc=$swift_rc windows $before_click -> $mid_click (recorded only)"'
            echo 'if [ "$mid_click" -lt "$before_click" ]; then'
            echo '  echo "DIFF-NOTE: raw CGEvent click LANDED on hosted (viability input)"'
            echo '  SWIFT_CLICK_LANDED=1'
            echo 'else'
            echo '  echo "DIFF-OK: raw CGEvent click denied as expected (port stands)"'
            echo 'fi'
            echo 'if [ "$(wincount)" = "0" ]; then'
            echo '  osascript -e "tell application \"Finder\" to make new Finder window"'
            echo '  sleep 2'
            echo 'fi'
            echo 'close_target'
            echo 'before_shim=$(wincount)'
            echo '"$SHIM_BIN/axclick" "$cx" "$cy" > "$OUT/shim-click.txt" 2>&1; shim_rc=$?'
            echo 'sleep 2'
            echo 'after_shim=$(wincount)'
            echo 'echo "shim click rc=$shim_rc windows $before_shim -> $after_shim"'
            echo 'if [ "$shim_rc" = "0" ] && [ "$after_shim" -lt "$before_shim" ] && grep -q "CLICKAT-OK" "$OUT/shim-click.txt"; then'
            echo '  echo "DIFF-OK: shim click landed (window closed)"'
            echo 'else'
            echo '  echo "DIFF-FAIL: shim click did not land"; FAIL=1'
            echo 'fi'
            echo 'if osascript -e "tell application \"System Events\" to key code 53" 2> "$OUT/keystroke.err"; then'
            echo '  echo "DIFF-OK: keystroke over SSH rc=0"'
            echo 'else'
            echo '  echo "DIFF-FAIL: keystroke over SSH failed"; FAIL=1'
            echo 'fi'
            echo 'if [ "$SWIFT_DUMP_OK" = "1" ] && [ "$SWIFT_PRESS_LANDED" = "1" ] && [ "$SWIFT_CLICK_LANDED" = "1" ]; then'
            echo '  echo "DIFF-FAIL: raw AX fully viable over SSH (reads+press+click); port unnecessary - human pivot decision"; FAIL=1'
            echo 'else'
            echo '  echo "DIFF-OK: raw AX not fully viable (port stands)"'
            echo 'fi'
            echo 'echo "DIFF-RESULT fail=$FAIL"'
            echo 'exit $FAIL'
          } > /tmp/driver-diff.sh
          bash -n /tmp/driver-diff.sh && echo "diff script syntax OK"
          ssh -o BatchMode=yes -i "${HOME}/.ssh/diff-loopback" localhost \
            "SWIFT_BIN=${RUNNER_TEMP}/swift-bin SHIM_BIN=${GITHUB_WORKSPACE}/qa-shims/qa/e2e/harnesses/desktop_macos/bin bash /tmp/driver-diff.sh" \
            | tee "${RUNNER_TEMP}/diff-log.txt"

      - name: Run Flutter leg over self-SSH
        if: always()
        shell: bash
        run: |
          # Installs the spike DMG and proves the REAL Flutter onboarding
          # tree is shim-readable (leg_unlock's assertions, rehearsed).
          {
            echo 'set -u'
            echo 'OUT="/tmp/driver-flutter"'
            echo 'mkdir -p "$OUT"'
            echo 'rm -f "$OUT"/*'
            echo 'FAIL=0'
            echo 'DMG=$(ls "$SPIKE_DIR"/DeployDash-*.dmg | head -n 1)'
            echo 'echo "dmg: $DMG"'
            echo 'hdiutil attach "$DMG" -nobrowse -readonly -mountpoint /tmp/spike-mount'
            echo 'cp -R /tmp/spike-mount/Deploy\ Dash.app /Applications/'
            echo 'hdiutil detach /tmp/spike-mount'
            echo 'if codesign --verify --deep --strict /Applications/Deploy\ Dash.app; then'
            echo '  echo "FLUTTER-OK: signature verifies"'
            echo 'else'
            echo '  echo "FLUTTER-FAIL: signature rejected"; FAIL=1'
            echo 'fi'
            echo 'open -a "Deploy Dash"'
            echo 'sleep 15'
            echo '"$SHIM_BIN/axdump" "Deploy Dash" > "$OUT/flutter-intro.txt" 2> "$OUT/flutter-intro.err"; rc=$?'
            echo 'echo "flutter dump rc=$rc"'
            echo 'cat "$OUT/flutter-intro.txt"'
            echo 'if grep -q "Get started" "$OUT/flutter-intro.txt"; then'
            echo '  echo "FLUTTER-OK: onboarding intro readable"'
            echo 'else'
            echo '  echo "FLUTTER-FAIL: no intro marker"; FAIL=1'
            echo 'fi'
            echo 'fields=$(grep -c "TextField" "$OUT/flutter-intro.txt" || true)'
            echo 'echo "intro TextField count: $fields"'
            echo 'if [ "$fields" = "0" ]; then'
            echo '  echo "FLUTTER-OK: zero intro fields"'
            echo 'else'
            echo '  echo "FLUTTER-FAIL: expected 0 intro fields"; FAIL=1'
            echo 'fi'
            echo 'screencapture -x "$OUT/flutter-intro.png" || true'
            echo 'pkill -x "Deploy Dash" || true'
            echo 'echo "FLUTTER-RESULT fail=$FAIL"'
            echo 'exit $FAIL'
          } > /tmp/driver-flutter.sh
          bash -n /tmp/driver-flutter.sh && echo "flutter script syntax OK"
          ssh -o BatchMode=yes -i "${HOME}/.ssh/diff-loopback" localhost \
            "SPIKE_DIR=${RUNNER_TEMP}/spike-dmg SHIM_BIN=${GITHUB_WORKSPACE}/qa-shims/qa/e2e/harnesses/desktop_macos/bin bash /tmp/driver-flutter.sh" \
            | tee "${RUNNER_TEMP}/flutter-log.txt"

      - name: Record timings
        if: always()
        shell: bash
        run: |
          {
            echo "## Driver timings on hosted macOS (seconds per dump)"
            echo ""
            grep -E "^shim-(full|sub)-[0-9]+ [0-9]+s" "${RUNNER_TEMP}/diff-log.txt" \
              || echo "(no timing lines; see log)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-driver-differential-${{ github.run_id }}
          path: |
            /tmp/driver-diff/
            /tmp/driver-flutter/
            ${{ runner.temp }}/diff-log.txt
            ${{ runner.temp }}/flutter-log.txt
          if-no-files-found: warn
          retention-days: 14
